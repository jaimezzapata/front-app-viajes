<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Fondo squircle con degradado profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Borde perimetral con acento Cyan y Verde Neón -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00FF85" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <!-- Estela de propulsión / contrail -->
    <linearGradient id="trailGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF85" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FF85" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="trailGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Fuselaje del avión con degradado nítido -->
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2F9FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Resplandor sutil para visibilidad en barra de pestañas oscuras y claras -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00E5FF" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle exterior -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Estelas curvas aerodinámicas de despegue (Neon Trails) -->
  <path d="M 8 54 C 13 46, 18 41, 25 35" fill="none" stroke="url(#trailGrad2)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8" />
  <path d="M 11 57 C 17 48, 23 40, 31 31" fill="none" stroke="url(#trailGrad1)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Partícula / chispa de despegue -->
  <circle cx="11" cy="57" r="1.5" fill="#00FF85" opacity="0.9" />

  <!-- Avión supersónico escalado y orientado a 45 grados de despegue -->
  <g transform="translate(35, 29) rotate(45) translate(-32, -32)" filter="url(#glow)">
    <!-- Alas y cuerpo -->
    <path d="M 32 8
             C 33.2 12, 34 16, 34 22
             L 53 35
             L 53 38.5
             L 34 33
             L 34 44
             L 43 51
             L 43 53.5
             L 32.8 51.5
             L 32 52.5
             L 31.2 51.5
             L 21 53.5
             L 21 51
             L 30 44
             L 30 33
             L 11 38.5
             L 11 35
             L 30 22
             C 30 16, 30.8 12, 32 8 Z"
          fill="url(#planeBody)" />

    <!-- Acento de cabina de mando -->
    <ellipse cx="32" cy="18" rx="1.8" ry="3.5" fill="#060911" opacity="0.85" />

    <!-- Acento en punta de alas (Winglets) Verde Neón -->
    <polygon points="53,35 54.5,33 53,38" fill="#00FF85" />
    <polygon points="11,35 9.5,33 11,38" fill="#00FF85" />
  </g>
</svg>